name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src\ObsidianTaskbarIcons\ObsidianTaskbarIcons.csproj -c Release

      - name: Publish single-file exe
        run: dotnet publish src\ObsidianTaskbarIcons\ObsidianTaskbarIcons.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o dist

      - uses: actions/upload-artifact@v7
        with:
          name: ObsidianTaskbarIcons-win-x64
          path: dist\ObsidianTaskbarIcons.exe
